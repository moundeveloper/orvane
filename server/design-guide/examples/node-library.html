<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Workflow library</title>
<style>
:root{--canvas:#e9edf0;--app:#f7f9fa;--strong:#273f50;--text:#455968;--muted:#5d7381;--faint:#8296a2;--accent:#6f8998;--run:#365f78;--line:#e3eaee;--mono:"Cascadia Code",Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.5 "Inter Variable",Inter,"Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--canvas);display:grid;place-items:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:minmax(0,1fr) 300px;width:880px;height:520px;background:var(--app);border-radius:10px;box-shadow:0 1px 2px #263f5512,0 10px 30px #263f551c;overflow:hidden}
.board{position:relative;background:radial-gradient(#cfdae1 1px,transparent 1.2px) 0 0/18px 18px,#f2f5f7}
.node{position:absolute;display:grid;justify-items:center;gap:4px;width:112px;padding:12px 8px 10px;border:1px solid #d3dee5;border-radius:12px;background:#fbfcfd;box-shadow:0 2px 8px #263f5512;font-size:12px;color:var(--strong)}
.node small{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.node .ico{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#e4edf2;color:var(--run)}
.node svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.node.sel{border-color:#7b97a7;box-shadow:0 0 0 3px #6f899826,0 4px 14px #263f551a}
.ghost{position:absolute;left:280px;top:336px;width:112px;height:86px;border:1.5px dashed #9fb6c3;border-radius:12px;background:#fbfcfd80}
.wires{position:absolute;inset:0;width:100%;height:100%}
.wires path{fill:none;stroke:#a9bcc7;stroke-width:1.5}
.wires .hot{stroke:var(--run);stroke-dasharray:4 4}
.port{position:absolute;width:9px;height:9px;border-radius:50%;background:#fbfcfd;border:1.5px solid #9fb6c3}
.lib{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:#f7f9fa}
.search{display:flex;align-items:center;gap:7px;margin:10px;height:30px;padding:0 9px;border:1px solid #d3dee5;border-radius:7px;background:#fbfcfd;color:var(--faint);font-size:12.5px}
.search svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.search kbd{margin-left:auto;font:10.5px var(--mono);padding:1px 5px;border:1px solid #d6e0e6;border-radius:4px}
.groups{flex:1;overflow:auto;padding:0 6px 8px;scrollbar-width:thin;scrollbar-color:#c5d3db transparent}
.g{display:flex;align-items:center;gap:6px;width:100%;height:28px;padding:0 6px;border:0;background:transparent;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#7a8f9b}
.g svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.g.open svg{transform:rotate(90deg)}
.g b{margin-left:auto;font-weight:500;letter-spacing:0}
.it{display:grid;grid-template-columns:30px minmax(0,1fr) 14px;align-items:center;gap:9px;width:100%;padding:6px;border:0;border-radius:8px;background:transparent;text-align:left;cursor:grab}
.it:hover,.it.on{background:#e4edf2}
.it .ico{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:#fbfcfd;border:1px solid #dde6eb;color:var(--run)}
.it .ico svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.it strong{display:block;font-size:12.5px;font-weight:550;color:var(--strong)}
.it span{display:block;font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{width:14px;height:14px;fill:none;stroke:#b6c6cf;stroke-width:1.6}
.star.f{fill:#6f8998;stroke:#6f8998}
.foot{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-top:1px solid var(--line);font-size:11px;color:var(--faint)}
</style></head>
<body>
<div class="app">
  <div class="board">
    <svg class="wires" viewBox="0 0 580 520" preserveAspectRatio="none"><path d="M156 148 C 220 148, 220 230, 280 230"/><path class="hot" d="M336 286 L 336 336"/></svg>
    <div class="node" style="left:44px;top:104px"><small>Trigger</small><span class="ico"><svg viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg></span>Every morning</div>
    <div class="node sel" style="left:280px;top:186px"><small>Action</small><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 7h6l2 2h8v9H4z"/></svg></span>Watch folder</div>
    <div class="ghost"></div>
  </div>
  <aside class="lib" aria-label="Workflow library">
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>Add a step…<kbd>/</kbd></div>
    <div class="groups">
      <button class="g open"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>Favourites<b>3</b></button>
      <button class="it on"><span class="ico"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M8 10l3 2-3 2M13 15h3"/></svg></span><div><strong>Run agent</strong><span>Start Claude Code or Codex with a prompt</span></div><svg class="star f" viewBox="0 0 24 24"><path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.4 6.8 19.2l1-5.9L3.5 9.2l5.9-.8z"/></svg></button>
      <button class="it"><span class="ico"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M9 9h6M9 13h6"/></svg></span><div><strong>Append to note</strong><span>Write the result into a Notes page</span></div><svg class="star f" viewBox="0 0 24 24"><path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.4 6.8 19.2l1-5.9L3.5 9.2l5.9-.8z"/></svg></button>
      <button class="it"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></span><div><strong>Open page</strong><span>Load an address in a Browser app</span></div><svg class="star f" viewBox="0 0 24 24"><path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.4 6.8 19.2l1-5.9L3.5 9.2l5.9-.8z"/></svg></button>
      <button class="g open"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>Triggers<b>5</b></button>
      <button class="it"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></span><div><strong>Schedule</strong><span>At a time or every few minutes</span></div><svg class="star" viewBox="0 0 24 24"><path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.4 6.8 19.2l1-5.9L3.5 9.2l5.9-.8z"/></svg></button>
      <button class="it"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 7h6l2 2h8v9H4z"/></svg></span><div><strong>File changed</strong><span>When a file in a folder is saved</span></div><svg class="star" viewBox="0 0 24 24"><path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.4 6.8 19.2l1-5.9L3.5 9.2l5.9-.8z"/></svg></button>
      <button class="g"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>Actions<b>18</b></button>
      <button class="g"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>Custom tools<b>4</b></button>
    </div>
    <div class="foot">Drag onto the board, or Enter to add after the selection</div>
  </aside>
</div>
</body></html>

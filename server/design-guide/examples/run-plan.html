<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Run history</title>
<style>
:root{--canvas:#e9edf0;--app:#f7f9fa;--strong:#273f50;--text:#455968;--faint:#8296a2;--accent:#6f8998;--line:#e3eaee;--mono:"Cascadia Code",Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:13px/1.5 "Inter Variable",Inter,"Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--canvas);display:grid;place-items:center;-webkit-font-smoothing:antialiased}
.app{width:900px;border-radius:10px;background:var(--app);box-shadow:0 1px 2px #263f5512,0 10px 30px #263f551c}
header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
header strong{color:var(--strong);font-weight:600}
header span{color:var(--faint);font-size:12px}
.grow{flex:1}
.seg{display:flex;gap:2px;padding:2px;border-radius:7px;background:#e8eff3}
.seg button{height:24px;padding:0 9px;border:0;border-radius:5px;background:transparent;font:inherit;font-size:11.5px;color:#5d7381}
.seg button[aria-pressed=true]{background:#fbfcfd;color:var(--strong);box-shadow:0 1px 2px #263f5512}
.grid{display:grid;grid-template-columns:190px 1fr}
.scale{display:contents}
.scale div:first-child{border-bottom:1px solid var(--line)}
.hours{position:relative;height:30px;border-bottom:1px solid var(--line)}
.hours span{position:absolute;top:7px;font:11px var(--mono);color:#9aabb5;transform:translateX(-50%)}
.name{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-bottom:1px solid #edf1f4;font-size:12.5px;color:var(--strong);font-weight:550}
.name small{margin-left:auto;font:11px var(--mono);color:var(--faint);font-weight:400}
.lane{position:relative;height:44px;border-bottom:1px solid #edf1f4;background-image:linear-gradient(to right,#edf1f4 1px,transparent 1px);background-size:calc(100%/8) 100%}
.run{position:absolute;top:12px;height:20px;min-width:6px;border-radius:5px;background:#9fb6c3}
.run.ok{background:#8fb39b}.run.fail{background:#c78d7b}.run.long{display:flex;align-items:center;padding:0 7px;font-size:11px;color:#fff;font-weight:500;white-space:nowrap}
.run.sel{box-shadow:0 0 0 2px #fbfcfd,0 0 0 4px #6f8998}
.now{position:absolute;top:0;bottom:0;border-left:1.5px solid #6f8998}
.tip{position:absolute;left:600px;top:96px;z-index:2;width:250px;padding:10px 12px;border:1px solid #dbe4ea;border-radius:9px;background:#fbfcfd;box-shadow:0 12px 32px -8px #263f5533;font-size:12px}
.tip strong{display:block;color:var(--strong);font-weight:600}
.tip p{margin:2px 0 8px;color:#9a5a49}
.tip .row{display:flex;justify-content:space-between;color:var(--faint);font-size:11.5px}
.tip .row b{font-weight:500;color:var(--text);font-family:var(--mono)}
.tip .acts{display:flex;gap:6px;margin-top:9px}
.tip button{height:26px;padding:0 9px;border:1px solid #d6e0e6;border-radius:6px;background:#fbfcfd;font:inherit;font-size:11.5px;color:var(--strong)}
.wrap{position:relative}
</style></head><body>
<div class="app wrap" aria-label="Automation runs">
  <header><strong>Automation runs</strong><span>Today · 14 runs · 1 failed</span><span class="grow"></span>
    <div class="seg" role="group" aria-label="Range"><button aria-pressed="true">Today</button><button aria-pressed="false">7 days</button></div></header>
  <div class="grid">
    <div style="border-bottom:1px solid var(--line)"></div>
    <div class="hours"><span style="left:0;transform:none;padding-left:4px">08</span><span style="left:12.5%">09</span><span style="left:25%">10</span><span style="left:37.5%">11</span><span style="left:50%">12</span><span style="left:62.5%">13</span><span style="left:75%">14</span><span style="left:87.5%">15</span></div>

    <div class="name">Morning digest<small>1</small></div>
    <div class="lane"><span class="run ok long" style="left:0.5%;width:9%">4m</span><span class="now" style="left:63%"></span></div>

    <div class="name">Watch downloads<small>9</small></div>
    <div class="lane"><span class="run ok" style="left:1%"></span><span class="run ok" style="left:7%"></span><span class="run ok" style="left:13%"></span><span class="run ok" style="left:19%"></span><span class="run ok" style="left:26%"></span><span class="run ok" style="left:32%"></span><span class="run ok" style="left:38%"></span><span class="run ok" style="left:44%"></span><span class="run ok" style="left:51%"></span><span class="now" style="left:63%"></span></div>

    <div class="name">NetSuite export<small>2</small></div>
    <div class="lane"><span class="run ok long" style="left:12%;width:7%">2m 10s</span><span class="run fail long sel" style="left:38%;width:4%">✕</span><span class="now" style="left:63%"></span></div>

    <div class="name">Capture to Notes<small>2</small></div>
    <div class="lane"><span class="run ok" style="left:22%"></span><span class="run ok" style="left:57%"></span><span class="now" style="left:63%"></span></div>

    <div class="name" style="border-bottom:0">Clean Inbox<small>0</small></div>
    <div class="lane" style="border-bottom:0"><span class="run" style="left:93%;background:transparent;border:1.5px dashed #9fb6c3;width:30px"></span><span class="now" style="left:63%"></span></div>
  </div>
  <div class="tip" role="dialog" aria-label="Run details">
    <strong>NetSuite export · 11:04</strong>
    <p>Step 2 of 4 failed: sign-in expired</p>
    <div class="row"><span>Started by</span><b>Trigger</b></div>
    <div class="row"><span>Took</span><b>38s</b></div>
    <div class="acts"><button>Open workflow</button><button>Run again</button></div>
  </div>
</div>
</body></html>

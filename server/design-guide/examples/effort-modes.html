<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Effort and mode</title>
<style>
:root{--canvas:#e9edf0;--app:#f7f9fa;--strong:#273f50;--text:#455968;--muted:#5d7381;--faint:#8296a2;--accent:#6f8998;--run:#365f78;--line:#e3eaee;--mono:"Cascadia Code",Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.5 "Inter Variable",Inter,"Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--canvas);display:grid;place-items:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.app{position:relative;width:760px;height:420px;padding:22px 30px;background:var(--app);border-radius:10px;box-shadow:0 1px 2px #263f5512,0 10px 30px #263f551c;display:flex;flex-direction:column;justify-content:flex-end}
.composer{position:relative;display:grid;gap:9px;padding:10px;border:1px solid #7b97a7;border-radius:14px;background:#fbfcfd;box-shadow:inset 0 1px 3px #53738c12,0 10px 28px #263f551a}
textarea{border:0;resize:none;background:transparent;font:inherit;font-size:13.5px;color:var(--strong);outline:0;height:42px;padding:2px 4px}
.bar{display:flex;align-items:center;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px 0 8px;border:1px solid #dbe5eb;border-radius:8px;background:#fbfcfd;font-size:12px;color:var(--text)}
.pill:hover{background:#eef3f6}
.pill svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--accent)}
.pill .v{color:var(--strong);font-weight:550}
.pill[aria-expanded=true]{background:#eef3f6;border-color:#c5d4dd}
.pill.mode{border-color:transparent;background:#e4edf2;color:#30536a}
.grow{flex:1}
.hint{font-size:11px;color:var(--faint)}
kbd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border:1px solid #d6e0e6;border-bottom-width:2px;border-radius:4px;background:#fbfcfd;font:10.5px/1 var(--mono);color:var(--muted)}
.send{display:grid;place-items:center;width:30px;height:30px;border:0;border-radius:9px;background:var(--run);color:#fff}
.send svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* effort popover */
.pop{position:absolute;left:96px;bottom:calc(100% + 8px);width:300px;padding:12px 14px 12px;border:1px solid #d3dee5;border-radius:10px;background:#fbfcfd;box-shadow:0 1px 2px #263f5514,0 12px 30px #263f5526;animation:in .14s ease-out}
@keyframes in{from{opacity:0;transform:translateY(3px)}}
.pop header{display:flex;align-items:baseline;gap:7px;margin-bottom:10px}
.pop header span{color:var(--faint);font-size:12px}
.pop header strong{color:var(--strong);font-weight:600;font-size:13px}
.pop header em{margin-left:auto;font-style:normal;font-size:11px;color:var(--faint)}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-bottom:6px}
.track{position:relative;height:26px;border-radius:7px;background:#eef3f6;display:grid;grid-template-columns:repeat(4,1fr);align-items:center}
.fill{position:absolute;inset:0 auto 0 0;width:62.5%;border-radius:7px;background:linear-gradient(90deg,#e1ebf1,#c9d9e3)}
.notch{position:relative;justify-self:center;width:4px;height:4px;border-radius:50%;background:#a9bcc7}
.knob{position:absolute;left:62.5%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fbfcfd;border:1.5px solid var(--run);box-shadow:0 2px 6px #365f7833;display:grid;place-items:center}
.knob::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--run)}
.levels{display:grid;grid-template-columns:repeat(4,1fr);margin-top:6px;font-size:11px;color:var(--faint);text-align:center}
.levels .on{color:var(--strong);font-weight:550}
.rec{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.rec i{width:6px;height:6px;border-radius:50%;background:#4f7d5f}
.rec span{margin-left:auto;color:var(--faint)}
</style></head>
<body>
<div class="app">
  <div class="composer">
    <div class="pop" role="dialog" aria-label="Effort">
      <header><span>Effort</span><strong>High</strong><em>Ctrl+←/→</em></header>
      <div class="ends"><span>Faster</span><span>Smarter</span></div>
      <div class="track" role="slider" aria-valuetext="High" tabindex="0"><span class="fill"></span><i class="notch"></i><i class="notch"></i><i class="notch"></i><i class="notch"></i><span class="knob"></span></div>
      <div class="levels"><span>Low</span><span>Medium</span><span class="on">High</span><span>Max</span></div>
      <div class="rec"><i></i>Recommended for code changes<span>Sonnet 5.5</span></div>
    </div>
    <textarea aria-label="Message">Refactor the context picker to share code with Ctrl+K search</textarea>
    <div class="bar">
      <button class="pill"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9 9h6v6H9z"/></svg><span class="v">Sonnet 5.5</span></button>
      <button class="pill" aria-expanded="true"><svg viewBox="0 0 24 24"><path d="M4 18h3M10 18h10M4 12h9M16 12h4M4 6h1M8 6h12"/><circle cx="8.5" cy="18" r="1.5"/><circle cx="14.5" cy="12" r="1.5"/><circle cx="6.5" cy="6" r="1.5"/></svg>Effort <span class="v">High</span></button>
      <button class="pill mode"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg>Edits <span class="v">Ask first</span></button>
      <span class="grow"></span>
      <span class="hint"><kbd>Shift</kbd> <kbd>Tab</kbd> mode</span>
      <button class="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
    </div>
  </div>
</div>
</body></html>

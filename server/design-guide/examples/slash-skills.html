<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Slash skills</title>
<style>
:root{--canvas:#e9edf0;--app:#f7f9fa;--strong:#273f50;--text:#455968;--muted:#5d7381;--faint:#8296a2;--accent:#6f8998;--run:#365f78;--line:#e3eaee;--mono:"Cascadia Code",Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.5 "Inter Variable",Inter,"Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--canvas);display:grid;place-items:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.app{width:760px;height:500px;padding:22px 30px 20px;background:var(--app);border-radius:10px;box-shadow:0 1px 2px #263f5512,0 10px 30px #263f551c;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
.composer{position:relative;display:grid;gap:8px;padding:10px 10px 10px 14px;border:1px solid #7b97a7;border-radius:14px;background:#fbfcfd;box-shadow:inset 0 1px 3px #53738c12,0 10px 28px #263f551a}
.line{font-size:13.5px;color:var(--strong);min-height:40px}
.line .tok{color:#385d76;background:#e4edf2;border-radius:4px;padding:1px 3px;font-family:var(--mono);font-size:12.5px}
.caret{display:inline-block;width:1px;height:16px;background:var(--strong);vertical-align:-3px;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.bar{display:flex;justify-content:flex-end}
.send{display:grid;place-items:center;width:30px;height:30px;border:0;border-radius:9px;background:#dfe8ee;color:var(--run)}
.send svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* menu */
.menu{position:absolute;left:8px;width:430px;bottom:calc(100% + 8px);border:1px solid #d3dee5;border-radius:10px;background:#fbfcfd;box-shadow:0 1px 2px #263f5514,0 12px 30px #263f5526;overflow:hidden}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-bottom:1px solid var(--line);color:var(--faint);font-size:12.5px}
.search b{color:var(--strong);font-weight:500;font-family:var(--mono);font-size:12px}
.sec{padding:6px 12px 2px;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#7a8f9b}
.list{padding:2px 5px 5px}
.item{display:grid;grid-template-columns:18px minmax(0,auto) minmax(0,1fr) auto;align-items:center;gap:9px;width:100%;height:32px;padding:0 8px;border:0;border-radius:6px;background:transparent;text-align:left}
.item[aria-selected=true]{background:#e4edf2}
.item svg{width:15px;height:15px;fill:none;stroke:var(--accent);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.item .n{font-family:var(--mono);font-size:12px;color:var(--strong)}
.item .d{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--faint)}
kbd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border:1px solid #d6e0e6;border-bottom-width:2px;border-radius:4px;background:#fbfcfd;font:10.5px/1 var(--mono);color:var(--muted)}
.foot{display:flex;align-items:center;gap:10px;height:30px;padding:0 12px;border-top:1px solid var(--line);font-size:11px;color:var(--faint)}
.foot span:first-child{flex:1}
/* row of saved skills */
.skills{display:flex;align-items:center;gap:6px;padding:0 4px}
.skills .clock{width:14px;height:14px;fill:none;stroke:var(--faint);stroke-width:1.7;stroke-linecap:round}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border:1px solid #dbe5eb;border-radius:7px;background:#fbfcfd;font:11.5px/1 var(--mono);color:var(--muted)}
.chip:hover{background:#eef3f6;color:var(--strong)}
.chip.add{font-family:inherit;border-style:dashed;color:var(--faint)}
.grow{flex:1}
</style></head>
<body>
<div class="app">
  <div class="composer">
    <div class="menu" role="listbox" aria-label="Skills and commands">
      <div class="search"><b>/sc</b> filter skills, commands and saved prompts</div>
      <div class="sec">Skills</div>
      <div class="list">
        <button class="item" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg><span class="n">/scoped-fix</span><span class="d">Fix a bug exactly where it happens</span><kbd>Tab</kbd></button>
        <button class="item"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h6"/></svg><span class="n">/schedule</span><span class="d">Run a prompt on a schedule</span></button>
        <button class="item"><svg viewBox="0 0 24 24"><path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 15.8 7.1 18.2l.9-5.5-4-3.9 5.5-.8z"/></svg><span class="n">/feature-scout</span><span class="d">Research similar apps, suggest features</span></button>
      </div>
      <div class="sec">Session</div>
      <div class="list">
        <button class="item"><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg><span class="n">/compact</span><span class="d">Summarize the conversation to save context</span></button>
      </div>
      <div class="foot"><span>14 skills from your skills folder</span><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Tab</kbd> insert</span></div>
    </div>
    <div class="line"><span class="tok">/sc</span><span class="caret"></span></div>
    <div class="bar"><button class="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></div>
  </div>
  <div class="skills">
    <svg class="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
    <button class="chip">/scoped-fix</button><button class="chip">/ui-workshop</button><button class="chip">/media-digest</button><button class="chip add">+ Save prompt</button>
    <span class="grow"></span>
  </div>
</div>
</body></html>

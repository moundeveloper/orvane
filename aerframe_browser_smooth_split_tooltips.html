.pane-divider{width:3px}
.start-search{height:49px;box-shadow:0 3px 17px rgba(65,94,112,.045)}
.start-search input{outline:none!important;border:0!important;box-shadow:none!important}

.command-results::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}

.peek-address{position:absolute;left:14px;top:13px;max-width:calc(100% - 30px);display:flex;align-items:center;gap:7px;color:var(--sub);font-size:10px;z-index:1;background:var(--surface);border:1px solid var(--line-soft);padding:6px 9px;border-radius:6px;box-shadow:0 2px 6px rgba(60,83,96,.07);pointer-events:none;opacity:.96}
.peek-address span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:370px}
.peek-address svg{width:12px;height:12px}
.peek-frame-help{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;max-width:calc(100% - 24px);font-size:10px;color:var(--sub);white-space:nowrap;padding:7px 10px;background:var(--surface);border:1px solid var(--line);border-radius:7px;box-shadow:0 3px 10px rgba(40,70,90,.08)}

.peek-control{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;color:var(--sub);transition:background .15s,color .15s}
.peek-control svg{width:16px;height:16px}
.peek-control:hover{background:var(--selection);color:var(--ink)}
.peek-rail-line{width:17px;height:1px;background:var(--line-soft);margin:3px 0}
.peek-rail-spacer{flex:1}
.peek-rail-badge{color:var(--faint);margin-bottom:2px}
.peek-rail-badge svg{width:15px;height:15px}
@media(max-width:900px){.toolbar{gap:5px;padding:0 9px}.toolbar-trailing .icon-button{width:26px}.nav-controls .icon-button{width:26px}.peek-panel{width:calc(100% - 42px);height:calc(100% - 55px)}}

function beginCommandScrollDrag(event){
 const rail=event.target.closest('#command-scrollbar');
 if(!rail||rail.hidden)return;
 const list=document.getElementById('command-results');
 const thumb=document.getElementById('command-scroll-thumb');
 if(!list||!thumb)return;
 event.preventDefault();
 const bounds=rail.getBoundingClientRect();
 const thumbBounds=thumb.getBoundingClientRect();
 const grab=event.target.closest('#command-scroll-thumb')?event.clientY-thumbBounds.top:thumbBounds.height/2;
 const move=(clientY)=>{
  const maximum=Math.max(1,rail.clientHeight-thumb.offsetHeight);
  const position=Math.max(0,Math.min(maximum,clientY-bounds.top-grab));
  list.scrollTop=(position/maximum)*(list.scrollHeight-list.clientHeight);
 };
 rail.setPointerCapture(event.pointerId);
 move(event.clientY);
 const onMove=e=>{if(e.pointerId===event.pointerId)move(e.clientY);};
 const onStop=e=>{
  if(e.pointerId!==event.pointerId)return;
  rail.removeEventListener('pointermove',onMove);
  rail.removeEventListener('pointerup',onStop);
  rail.removeEventListener('pointercancel',onStop);
  if(rail.hasPointerCapture(e.pointerId))rail.releasePointerCapture(e.pointerId);
 };
 rail.addEventListener('pointermove',onMove);
 rail.addEventListener('pointerup',onStop);
 rail.addEventListener('pointercancel',onStop);
}

document.addEventListener('pointerdown',beginCommandScrollDrag);
document.addEventListener('pointermove',event=>{
 const row=event.target.closest('[data-command-index]');if(row&&modalMode?.command){const idx=Number(row.dataset.commandIndex);if(commandIndex!==idx){commandIndex=idx;el('command-results').querySelectorAll('.command-row').forEach((node,i)=>node.classList.toggle('selected',i===idx));}}
});
document.addEventListener('change',event=>{
 if(event.target.id==='sidebar-check'){state.sidebarCollapsed=event.target.checked;render();drawDrawer();}
 if(event.target.id==='peek-enable'){
   state.peekEnabled=event.target.checked;
   if(!state.peekEnabled){
     state.peekAuto=false;
     const activeOwner=activeId();
     for(const t of [...state.tabs]){
       if(!t.peek)continue;
       const promoted=createTab(t.peek.url,{space:t.space});state.tabs.push(promoted);
       if(activeOwner===t.id){state.primary=promoted.id;state.focused='primary';}
       delete t.peek;removeCachedPeek(t.id);
     }
   }else state.peekAuto=true;
   render();drawDrawer();
 }
 if(event.target.id==='peek-auto'){state.peekAuto=event.target.checked;save();drawDrawer();}
});
document.addEventListener('keydown',event=>{
 if(event.target.id==='address'&&event.key==='Enter'&&event.shiftKey){event.preventDefault();openPeek(el('address').value);el('address').blur();}
},true);
document.addEventListener('keydown',event=>{
 const cmd=event.metaKey||event.ctrlKey;
 const editable=event.target.matches('input,textarea,[contenteditable]');
 if(openSelect){
  if(['ArrowDown','ArrowUp','Home','End'].includes(event.key)){
   event.preventDefault();
   const length=selectChoices[openSelect.kind].length;
   const next=event.key==='Home'?0:event.key==='End'?length-1:openSelect.index+(event.key==='ArrowDown'?1:-1);
   setSelectHighlight(next);return;
  }
  if(event.key==='Enter'||event.key===' '){
   event.preventDefault();const option=selectChoices[openSelect.kind][openSelect.index];
   commitSelect(openSelect.kind,option.value);return;
  }
  if(event.key==='Escape'){event.preventDefault();closeCustomSelect(true);return;}
  if(event.key==='Tab'){closeCustomSelect(true);return;}
 }

 if(event.key==='Escape'){
   if(el('shade').classList.contains('visible'))closeDialog();
   else if(menu)closeMenu();
   else if(el('peek').classList.contains('open'))closePeek();
   else if(drawerMode)closeDrawer();
   else if(editable)event.target.blur();
   return;
 }
 if(modalMode?.command&&el('shade').classList.contains('visible')){
   if(event.key==='ArrowDown'||event.key==='ArrowUp'){
     event.preventDefault();selectCommandIndex(commandIndex+(event.key==='ArrowDown'?1:-1));
   }else if(event.key==='Home'&&event.target.id==='command-input'&&event.ctrlKey){event.preventDefault();selectCommandIndex(0);}
   else if(event.key==='End'&&event.target.id==='command-input'&&event.ctrlKey){event.preventDefault();selectCommandIndex(commandActions.length-1);}
   else if(event.key==='Enter'){event.preventDefault();runCommand(commandIndex);}
   return;
 }
 if(el('peek').classList.contains('open')){
   if(cmd&&event.key.toLowerCase()==='o'){event.preventDefault();promotePeek('tab');return;}
   if(cmd&&event.key.toLowerCase()==='w'){event.preventDefault();closePeek();return;}
 }
 if(cmd){
   const k=event.key.toLowerCase();
   if(k==='t'){event.preventDefault();if(event.shiftKey)reopenTab();else addTab();}
   else if(k==='l'){event.preventDefault();el('address').focus();el('address').select();}
   else if(k==='k'){event.preventDefault();openCommand();}
   else if(k==='w'){event.preventDefault();closeTab();}
   else if(k==='b'){event.preventDefault();openDrawer('library');}
   else if(k==='\\'){event.preventDefault();state.sidebarCollapsed=!state.sidebarCollapsed;render();}
   else if(!editable&&/[1-9]/.test(k)){const tab=visibleTabs()[Number(k)-1];if(tab){event.preventDefault();selectTab(tab.id);}}
   return;
 }
 const splitChoice=event.target.closest?.('.inline-split [data-split-pane]');
 if(splitChoice&&['ArrowUp','ArrowDown'].includes(event.key)){
   event.preventDefault();
   const pane=event.key==='ArrowUp'?'primary':'secondary';
   focusSplitChoice(pane);
   el('tab-scroll').querySelector(`.inline-split [data-split-pane="${pane}"]`)?.focus({preventScroll:true});
   return;
 }
 if(!editable&&event.altKey&&event.key==='ArrowLeft'){event.preventDefault();moveHistory(-1);}
 if(!editable&&event.altKey&&event.key==='ArrowRight'){event.preventDefault();moveHistory(1);}
 if(!editable&&event.key==='F5'){event.preventDefault();render();}
 if((event.key==='Enter'||event.key===' ')&&event.target.matches('[data-tab],[data-toggle-group]')){event.preventDefault();event.target.click();}
});
// Tab drag/drop: reorder vertically or drop onto a group.
let draggingTabId=null;
el('drawer-content').addEventListener('scroll',()=>closeCustomSelect(),{passive:true});
window.addEventListener('resize',()=>{closeCustomSelect();updateCommandScrollbar();});
el('tab-scroll').addEventListener('dragstart',event=>{const tab=event.target.closest('[data-tab]');if(!tab)return;draggingTabId=tab.dataset.tab;event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',draggingTabId);});
el('tab-scroll').addEventListener('dragover',event=>{if(!draggingTabId)return;const target=event.target.closest('[data-tab],[data-toggle-group]');if(!target)return;event.preventDefault();document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));target.classList.add('drag-over');});
el('tab-scroll').addEventListener('drop',event=>{event.preventDefault();document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));const dragged=tabById(draggingTabId);const group=event.target.closest('[data-toggle-group]');const target=event.target.closest('[data-tab]');if(dragged&&group){dragged.group=group.dataset.toggleGroup;dragged.pinned=false;const g=state.groups.find(x=>x.id===dragged.group);if(g)g.collapsed=false;}else if(dragged&&target&&dragged.id!==target.dataset.tab){const drop=tabById(target.dataset.tab);dragged.group=drop.group;dragged.pinned=drop.pinned;state.tabs=state.tabs.filter(t=>t.id!==dragged.id);const i=state.tabs.findIndex(t=>t.id===drop.id);state.tabs.splice(i,0,dragged);}draggingTabId=null;render();});
el('tab-scroll').addEventListener('dragend',()=>{draggingTabId=null;document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));});
// Resize sidebar and Split View using pointer capture, preventing the jump at the start of a drag.
function activateResize(handle,onMove,onEnd){handle.addEventListener('pointerdown',event=>{if(event.button!==0)return;event.preventDefault();handle.setPointerCapture(event.pointerId);document.body.classList.add('resizing');handle.classList.add('dragging');const move=e=>onMove(e);const end=()=>{handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',end);handle.removeEventListener('pointercancel',end);document.body.classList.remove('resizing');handle.classList.remove('dragging');onEnd?.();};handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',end);handle.addEventListener('pointercancel',end);});}
activateResize(el('sidebar-grip'),event=>{if(state.sidebarCollapsed)return;state.sidebarWidth=Math.min(376,Math.max(208,event.clientX));document.documentElement.style.setProperty('--sidebar-width',state.sidebarWidth+'px');},()=>save());
activateResize(el('pane-divider'),event=>{if(!state.split)return;const bounds=el('pane-holder').getBoundingClientRect();state.splitRatio=Math.max(25,Math.min(75,((event.clientX-bounds.left)/bounds.width)*100));el('pane-holder').querySelector('.pane.primary').style.width=state.splitRatio+'%';},()=>save());
el('pane-holder').addEventListener('pointerdown',event=>{const pane=event.target.closest('.pane');if(!pane||!state.split||event.target.closest('button,input,form'))return;const next=pane.dataset.pane;if(next!==state.focused){focusSplitChoice(next);}});
// Setup static icon slots.
for(const [id,icon] of Object.entries({'current-space-chevron':'down','sidebar-toggle':'sidebar','library-icon':'library','settings-button':'settings','back-button':'left','forward-button':'right','reload-button':'reload','home-button':'home','address-icon':'search','bookmark-button':'star','peek-button':'eye','split-button':'split','search-button':'search','menu-button':'more','drawer-close':'x'}))el(id).innerHTML=ico(icon);

// Custom tooltip manager: no native title bubbles; dynamic tab/menu/Peek
// elements use the same tooltip, including keyboard focus and shortcut hints.
const toolTip=el('aer-tooltip');
let tipOwner=null,tipTimer=0,tipByKeyboard=false;
let pointerX=-100,pointerY=-100;
let tipFrame=0;
const tooltipParts=raw=>{
 const text=String(raw||'');
 if(text.includes(' · ')){const [label,...rest]=text.split(' · ');return [label,rest.join(' · '),''];}
 const match=text.match(/^(.*?)\s*\(([^()]+)\)$/);
 return match?[match[1],match[2],'shortcut']:[text,'',''];
};
function positionTooltip(owner){
 if(!owner||!owner.isConnected||!toolTip.classList.contains('visible'))return;
 const bounds=toolTip.getBoundingClientRect();
 const r=owner.getBoundingClientRect();
 const W=window.innerWidth,H=window.innerHeight,margin=10;
 let left,top;
 if(tipByKeyboard||pointerX<0||pointerY<0){
   // Keyboard focus has no pointer: align the tooltip below the focused control.
   left=r.left+(r.width-bounds.width)/2;
   top=r.bottom+11;
   if(top+bounds.height>H-margin)top=r.top-bounds.height-11;
 }else{
   // Native browser tooltip style: noticeably below and to the right of the
   // pointer, not above it or under it. Flip only at the window edges.
   const dx=15,dy=23;
   left=pointerX+dx;
   top=pointerY+dy;
   if(left+bounds.width>W-margin)left=pointerX-bounds.width-17;
   if(top+bounds.height>H-margin)top=pointerY-bounds.height-21;
   // If the viewport is cramped, prefer the side that avoids the pointer.
   if(left<margin)left=Math.max(margin,Math.min(W-bounds.width-margin,pointerX+dx));
   if(top<margin)top=Math.max(margin,Math.min(H-bounds.height-margin,pointerY+dy));
 }
 left=Math.max(margin,Math.min(W-bounds.width-margin,left));
 top=Math.max(margin,Math.min(H-bounds.height-margin,top));
 toolTip.style.left=Math.round(left)+'px';toolTip.style.top=Math.round(top)+'px';
}
function hideTooltip(){
 clearTimeout(tipTimer);tipTimer=0;
 if(tipFrame)cancelAnimationFrame(tipFrame);tipFrame=0;
 tipOwner=null;
 toolTip.classList.remove('visible');toolTip.setAttribute('aria-hidden','true');
}
function planTooltip(owner,keyboard=false){
 if(owner===tipOwner){
   // Pointer hover takes precedence over keyboard focus to avoid sticky
   // tooltips above a mouse that is already over the control.
   if(!keyboard&&tipByKeyboard){tipByKeyboard=false;positionTooltip(owner);}
   return;
 }
 hideTooltip();
 if(!owner||!owner.isConnected||owner.matches(':disabled')||!owner.dataset.tooltip)return;
 tipOwner=owner;tipByKeyboard=keyboard;
 tipTimer=setTimeout(()=>{
   if(tipOwner!==owner||!owner.isConnected)return;
   const [label,meta,style]=tooltipParts(owner.dataset.tooltip);
   toolTip.querySelector('.aer-tooltip-label').textContent=label;
   const extra=toolTip.querySelector('.aer-tooltip-meta');extra.textContent=meta;extra.classList.toggle('shortcut',style==='shortcut');
   toolTip.classList.add('visible');toolTip.setAttribute('aria-hidden','false');
   positionTooltip(owner);
 },keyboard?240:500);
}
const tipCandidate=node=>node instanceof Element?node.closest('[data-tooltip]'):null;
document.addEventListener('pointerover',event=>{
 if(event.pointerType==='touch')return;
 pointerX=event.clientX;pointerY=event.clientY;
 const candidate=tipCandidate(event.target);
 if(candidate!==tipOwner)planTooltip(candidate);
},true);
document.addEventListener('pointermove',event=>{
 if(event.pointerType==='touch')return;
 pointerX=event.clientX;pointerY=event.clientY;
 if(!tipByKeyboard&&tipOwner&&toolTip.classList.contains('visible')&&!tipFrame){
   tipFrame=requestAnimationFrame(()=>{tipFrame=0;positionTooltip(tipOwner);});
 }
}, {passive:true,capture:true});
document.addEventListener('pointerout',event=>{
 if(!tipOwner||event.pointerType==='touch')return;
 const next=event.relatedTarget;
 if(next instanceof Node&&tipOwner.contains(next))return;
 if(next instanceof Element&&tipCandidate(next)===tipOwner)return;
 if(next instanceof Element){planTooltip(tipCandidate(next));}else hideTooltip();
},true);
document.addEventListener('focusin',event=>{
 const target=tipCandidate(event.target);
 if(target)planTooltip(target,true);
},true);
document.addEventListener('focusout',event=>{if(tipOwner&&tipOwner.contains(event.target))hideTooltip();},true);
document.addEventListener('pointerdown',hideTooltip,true);
document.addEventListener('dragstart',hideTooltip,true);
document.addEventListener('keydown',event=>{if(event.key==='Escape')hideTooltip();},true);
el('tab-scroll').addEventListener('scroll',hideTooltip,{passive:true});
el('drawer-content').addEventListener('scroll',hideTooltip,{passive:true});
window.addEventListener('resize',hideTooltip);
// Guard against future controls setting `title` dynamically: convert it to
// data-tooltip immediately; iframes retain their accessible title attributes.
const convertNativeTitles=root=>{
 if(root.nodeType!==1)return;
 const items=[root,...root.querySelectorAll('[title]')];
 for(const item of items){if(item.tagName==='IFRAME'||!item.hasAttribute('title'))continue;
  item.dataset.tooltip=item.getAttribute('title');item.removeAttribute('title');
 }
};
convertNativeTitles(document.body);
new MutationObserver(records=>{
 for(const record of records){
  if(record.type==='attributes'){convertNativeTitles(record.target);continue;}
  for(const child of record.addedNodes){if(child.nodeType===1)convertNativeTitles(child);}
 }
}).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['title']});

render();
})();

</script>
